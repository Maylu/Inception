# run tous les services
services:
  nginx:
    container_name: nginx
    build:
  # mettre le nom de notre dockerimage
      context: requirements/nginx
      dockerfile: Dockerfile
  # ex : 8080:80 expose le port 80 du conteneur sur le por 8080 de ka machine 
    ports:
      - "443:443"
    volumes:
      - wordpress:/data/www/wordpress
    networks:
      - inception
    restart: unless-stopped
    env_file: .env
    restart: on-failure

  wordpress:
    container_name: wordpress
    build:
  # mettre le nom de notre dockerimage
      context: requirements/wordpress
      dockerfile: Dockerfile
  # ex : 8080:80 expose le port 80 du conteneur sur le por 8080 de ka machine 
    expose:
      - "9000"
    volumes:
      - wordpress:/data/www/wordpress
    networks:
      - inception
    secrets:
      - db_password
      - db_root_password
    depends on: 
      - mariadb
    env_file: .env
    restart: on-failure

  mariadb:
    container_name: mariadb
    build:
  # mettre le nom de notre dockerimage
      context: requirements/mariadb
      dockerfile: Dockerfile
  # ex : 8080:80 expose le port 80 du conteneur sur le por 8080 de ka machine 
    expose:
      - "3306"
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - inception
    secrets:
      - db_password
      - db_root_password
    restart: unless-stopped
    env_file: .env
  
  # les donnees sont persistantes
volumes:
    mariadb:
      driver: local
      driver_opts:
      type: 'none'
      o: 'bind'
      device: '/Users/vboxuser/data/mariadb'
    wordpress:
      driver: local
      driver_opts:
      type: 'none'
      o: 'bind
      device: '/Users/vboxuser/data/wordpress'

secrets:
  db_password:
    file: ..secrets/db_password.txt
  db_root_password:
    file: ..secrets/db_root_password.txt