# run tous les services
services:
  nginx:
    container_name: nginx
    build:
  # mettre le nom de notre dockerimage
      context: ./nginx
      dockerfile: Dockerfile
  # ex : 8080:80 expose le port 80 du conteneur sur le por 8080 de ka machine 
    ports:
      - "443:443"
    volumes:
      - nginx_data:/usr/share
    networks:
      - inception
    restart: unless-stopped
    env_file: .env
  # les donnees sont persistantes
  volumes:
    nginx_data
