user www-data

worker_process auto;
pid /run/nginx.pid;

events {
    worker_connections 1024
}

http {
    server {
        listen 80;
        server_name gcamara.42.fr;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name gcamara.42.fr;
        # Secure Sockets Layer (SSL) protocol, il force ce protocole a s'installer
        ssl_certificate /etc/nginx/ssl/nginx.cert;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        # HIGH autorise uniquement les chiffrement de haute securite superieur a 128 bits
        # !aNULL desactive les algorithmes sans qui ne verifie pas l'identite du serveur
        # !MD5 desactive l'algorithme de hachage MD5 obselete et non securise
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://localhost:9000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location ~ \.php$ {
            include        snippets/fastcgi-php.conf;
            fastcgi_pass   wordpress:9000;
            fastcgi_index  index.php;
        }
        location ~ /\.ht {
            deny all;
        }
    }
}


