# run tous les services
services:
  nginx:
    container_name: nginx
    build:
  # mettre le nom de notre dockerimage
      context: requirements/nginx
      dockerfile: Dockerfile
  # ex : 8080:80 expose le port 80 du conteneur sur le por 8080 de ka machine 
    ports:
      - "443:443"
    volumes:
      - nginx_data:/usr/share
    networks:
      - inception
    restart: unless-stopped
    env_file: .env
    restart: on-failure
  
  mariadb:
    container_name: mariadb
    build:
  # mettre le nom de notre dockerimage
      context: requirements/mariadb
      dockerfile: Dockerfile
  # ex : 8080:80 expose le port 80 du conteneur sur le por 8080 de ka machine 
    expose:
      - "3306"
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - inception
    restart: unless-stopped
    env_file: .env
    restart: on-failure
  
  # les donnees sont persistantes
  volumes:
    nginx_data
